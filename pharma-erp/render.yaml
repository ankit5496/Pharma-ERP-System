# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates two resources: a Postgres database, and one web service that runs
# BOTH the Next.js web app and the NestJS API in a single process (see
# apps/server). They used to be two separate Render web services; merging
# them into one saves a full service's cost and turns what used to be a
# public-internet round trip (web → API) into an in-process call — see
# apps/server/src/index.ts and docs/Service-Merge-Plan-Web-API.docx for why.
# Deploy with Render → New → Blueprint, pointed at this repository.
#
# BEFORE the first deploy succeeds you must do two manual things — see
# "Deploying to Render" in the README for the walkthrough:
#
#   1. Run scripts/render-bootstrap.sql against the new database. It creates the
#      least-privilege `pharma_app` role that the API connects as. Without it,
#      DATABASE_URL has nothing to point at.
#   2. Set DATABASE_URL — the one remaining sync:false variable. It is the
#      `pharma_app` connection string from step 1, which only you can assemble,
#      so Render cannot supply it. JWT_SECRET no longer needs a manual value:
#      Render generates it (see the note on that key).
#
# If the deploy crash-loops on "Invalid environment configuration", read the
# variable name in that error and set it here — the API validates its whole
# environment before starting, on purpose, so a missing secret is a refusal to
# boot rather than a runtime failure once users are on it. Note the second-order
# symptom: a service that never binds a port has no instance, so Render's edge
# answers requests to it with a "no-server" 404 or a 429, neither of which
# mentions configuration.
#
# Why DATABASE_URL is not wired with `fromDatabase`: Render's generated
# connection string is for the database OWNER. The API must connect as a
# non-owner, non-superuser role or PostgreSQL row-level security does not apply
# to it — which is the whole basis of tenant isolation here. The owner URL is
# used for MIGRATION_DATABASE_URL only.

databases:
  - name: pharma-erp-main-db
    databaseName: pharma_erp_main_db
    user: pharma_erp_main_db_user
    plan: basic-256mb
    postgresMajorVersion: '16'
    ipAllowList: [] # only reachable from inside Render's network

services:
  # ---------------------------------------------------------------------------
  # Merged web + API — Next.js and NestJS in one process (apps/server)
  # ---------------------------------------------------------------------------
  - type: web
    name: pharma-erp
    runtime: node
    plan: starter
    region: oregon # keep the database and this service in one region
    branch: main
    # The project lives in a subfolder of the repository, so every command runs
    # from here. Omit it and paths resolve one directory too high, which surfaces
    # as "Cannot find module .../apps/server/dist/index.js" at start-up.
    rootDir: pharma-erp
    # Explicit --filter per package, not `@pharma-erp/server...`: apps/server's
    # reliance on apps/web's build output is a directory Next.js reads at
    # runtime, not a JS import, so Turborepo's dependency-graph inference can't
    # be trusted to pull apps/web's build in automatically.
    #
    # --prod=false on install: NODE_ENV=production is set below (the API reads
    # it at runtime), but pnpm also reads it during `install` and — on a build
    # with no prior node_modules cache — skips devDependencies entirely on that
    # signal alone. turbo itself is a root devDependency, so a from-scratch
    # build then fails with "Command "turbo" not found" before a single package
    # builds. --prod=false forces devDependencies in regardless of NODE_ENV.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@pharma-erp/api --filter=@pharma-erp/web --filter=@pharma-erp/server
    startCommand: node apps/server/dist/index.js
    # Migrations run once per deploy, before the new instance takes traffic.
    # Requires a paid instance type; on the free tier, run `pnpm db:migrate:deploy`
    # from a shell against MIGRATION_DATABASE_URL instead.
    preDeployCommand: pnpm --filter @pharma-erp/database db:migrate:deploy
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      # Enables corepack's pnpm without a global install.
      - key: PNPM_VERSION
        value: '9.15.4'

      # The OWNER connection: DDL for migrations, and tenant provisioning (which
      # RLS blocks for the application role by design).
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: pharma-erp-main-db
          property: connectionString

      # The RUNTIME connection, as `pharma_app`. Set this by hand after running
      # scripts/render-bootstrap.sql — take the owner URL above and swap the
      # username and password for pharma_app's. Keep `?sslmode=require`.
      - key: DATABASE_URL
        sync: false

      # apps/web's server-side API client (apps/web/src/lib/env.ts) reads this
      # at runtime and prefers it over NEXT_PUBLIC_API_URL. Since the API now
      # lives in the SAME process as the web app, this is a loopback call, not
      # a network hop — the exact thing that used to leave Render's network,
      # cross the public edge, and risk a 429 under load. Value must match the
      # PORT Render assigns this service (Render's default is 10000; check the
      # dashboard's "Port" field if this service ever binds a different one).
      - key: API_URL
        value: http://127.0.0.1:10000

      # CORS origin. No longer load-bearing for browser traffic — the browser
      # only ever talks to this one service now — but the API's env schema
      # still reads it, so it's kept for direct API clients. Defaults to
      # http://localhost:3000 if unset; set to this service's own public URL
      # after the first deploy if you want it to reflect reality.
      - key: WEB_ORIGIN
        sync: false

      # HMAC key for signing access tokens.
      #
      # generateValue rather than sync:false, because sync:false leaves the
      # variable EMPTY until someone fills it in, and the API fail-fasts without
      # it — the deploy then crash-loops, never binds a port, and Render's edge
      # answers requests for a service with no instance (a "no-server" 404, or a
      # 429), which looks nothing like a missing environment variable. Letting
      # Render generate a value removes that whole failure mode: there is no
      # manual step left to forget.
      #
      # Render generates a 256-bit random value, comfortably over the 32-character
      # minimum env.validation.ts enforces. It is generated once, on creation, and
      # is never overwritten afterwards — including if it was already set by hand.
      #
      # To rotate it, change it in the dashboard. Rotating signs every user out
      # immediately, because existing tokens no longer verify. To set one by hand:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: JWT_SECRET
        generateValue: true

      - key: APP_VERSION
        value: '0.1.0'
